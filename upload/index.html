<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未明シアター LP ジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="tool-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-label">未明シアター</span>
        <span class="brand-divider">|</span>
        <span class="brand-sub">LP ジェネレーター</span>
      </div>
      <p class="header-desc">ドラマ情報を入力するだけで、洗練されたLPを自動生成</p>
    </div>
  </header>

  <!-- ========== MAIN TOOL ========== -->
  <main class="tool-main">
    <div class="tool-container">

      <!-- STEP INDICATOR -->
      <div class="step-indicator">
        <div class="step active" data-step="1">
          <div class="step-num">01</div>
          <div class="step-label">基本情報</div>
        </div>
        <div class="step-line"></div>
        <div class="step active" data-step="2">
          <div class="step-num">02</div>
          <div class="step-label">出演者</div>
        </div>
        <div class="step-line"></div>
        <div class="step active" data-step="3">
          <div class="step-num">03</div>
          <div class="step-label">スチール写真</div>
        </div>
        <div class="step-line"></div>
        <div class="step active" data-step="4">
          <div class="step-num">04</div>
          <div class="step-label">LP生成</div>
        </div>
      </div>

      <!-- ===== SECTION 1: 基本情報 ===== -->
      <section class="form-section" id="section-basic">
        <div class="section-header">
          <span class="section-num">01</span>
          <h2 class="section-title">ドラマ基本情報</h2>
        </div>

        <div class="form-grid">
          <!-- ドラマタイトル -->
          <div class="form-group full-width">
            <label class="form-label">ドラマタイトル <span class="required">*</span></label>
            <input type="text" id="drama-title" class="form-input" placeholder="例：深夜の告白">
          </div>

          <!-- キャッチコピー -->
          <div class="form-group full-width">
            <label class="form-label">キャッチコピー</label>
            <input type="text" id="drama-catchcopy" class="form-input" placeholder="例：あの夜、すべてが変わった。">
          </div>

          <!-- YouTube URL -->
          <div class="form-group full-width">
            <label class="form-label">YouTube URL</label>
            <div class="url-input-wrap">
              <span class="url-prefix yt"><i class="fab fa-youtube"></i></span>
              <input type="url" id="drama-youtube" class="form-input url-input" placeholder="https://www.youtube.com/@未明シアター">
            </div>
          </div>

          <!-- Instagram URL -->
          <div class="form-group full-width">
            <label class="form-label">Instagram URL</label>
            <div class="url-input-wrap">
              <span class="url-prefix insta"><i class="fab fa-instagram"></i></span>
              <input type="url" id="drama-instagram" class="form-input url-input" placeholder="https://www.instagram.com/未明シアター/">
            </div>
          </div>

          <!-- あらすじ -->
          <div class="form-group full-width">
            <label class="form-label">あらすじ <span class="required">*</span></label>
            <textarea id="drama-synopsis" class="form-textarea" rows="6" placeholder="ドラマのあらすじを入力してください。2〜3段落程度が理想です。"></textarea>
          </div>

          <!-- キービジュアル -->
          <div class="form-group full-width">
            <label class="form-label">キービジュアル（メイン画像）<span class="required">*</span></label>
            <div class="upload-area" id="kv-upload-area">
              <input type="file" id="kv-upload" accept="image/*" hidden>
              <div class="upload-placeholder" onclick="document.getElementById('kv-upload').click()">
                <i class="fas fa-image upload-icon"></i>
                <p class="upload-text">クリックして画像をアップロード</p>
                <p class="upload-sub">推奨：横長（16:9）の高解像度画像</p>
              </div>
              <img id="kv-preview" class="upload-preview hidden" alt="キービジュアル">
              <button class="upload-remove hidden" id="kv-remove"><i class="fas fa-times"></i> 削除</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== SECTION 2: 出演者 ===== -->
      <section class="form-section" id="section-cast">
        <div class="section-header">
          <span class="section-num">02</span>
          <h2 class="section-title">出演者情報</h2>
        </div>

        <div id="cast-list">
          <!-- JS で動的追加 -->
        </div>

        <button class="add-cast-btn" id="add-cast-btn">
          <i class="fas fa-plus"></i> 出演者を追加する
        </button>
      </section>

      <!-- ===== SECTION 3: スチール写真 ===== -->
      <section class="form-section" id="section-stills">
        <div class="section-header">
          <span class="section-num">03</span>
          <h2 class="section-title">ドラマ スチール写真</h2>
        </div>
        <p class="section-desc">ドラマのシーン写真を最大8枚までアップロードできます。</p>

        <div class="stills-grid" id="stills-grid">
          <!-- JS で動的生成 -->
        </div>

        <button class="add-still-btn" id="add-still-btn">
          <i class="fas fa-plus"></i> スチール写真を追加（最大8枚）
        </button>
      </section>

      <!-- ===== GENERATE BUTTON ===== -->
      <div class="generate-area">
        <button class="generate-btn" id="generate-btn">
          <i class="fas fa-magic"></i>
          LP を生成する
        </button>
        <p class="generate-note">入力内容をもとにLPページを自動生成します</p>
      </div>

    </div><!-- /.tool-container -->
  </main>

  <!-- ========== LP PREVIEW MODAL ========== -->
  <div class="modal-overlay hidden" id="preview-modal">
    <div class="modal-inner">
      <div class="modal-toolbar">
        <span class="modal-title"><i class="fas fa-eye"></i> LP プレビュー</span>
        <div class="modal-actions">
          <button class="modal-btn download-btn" id="download-btn">
            <i class="fas fa-download"></i> HTMLをダウンロード
          </button>
          <button class="modal-btn close-btn" id="close-modal">
            <i class="fas fa-times"></i> 閉じる
          </button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="preview-iframe" title="LP プレビュー"></iframe>
      </div>
    </div>
  </div>

  <!-- 画像自動圧縮パッチ: FileReader.readAsDataURL を縮小+JPEG圧縮で上書き -->
  <script>
  (function () {
    var MAX_DIM   = 1600;        // 長辺の最大ピクセル数
    var QUALITY   = 0.82;        // JPEG 品質
    var MIN_BYTES = 200 * 1024;  // これ未満の画像は圧縮しない

    var origRead = FileReader.prototype.readAsDataURL;

    FileReader.prototype.readAsDataURL = function (file) {
      var self = this;
      try {
        var isTarget = file && typeof file.type === 'string' &&
                       /^image\/(jpeg|png|webp)$/i.test(file.type) &&
                       file.size >= MIN_BYTES;
        if (!isTarget) return origRead.call(self, file);

        var url = URL.createObjectURL(file);
        var img = new Image();

        img.onload = function () {
          try {
            var w = img.naturalWidth, h = img.naturalHeight;
            var scale = Math.min(1, MAX_DIM / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * scale));
            var ch = Math.max(1, Math.round(h * scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';               // PNG透過はJPEGで黒背景に
            ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, 0, 0, cw, ch);
            URL.revokeObjectURL(url);

            var dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
            var approx  = Math.ceil((dataUrl.length - 'data:image/jpeg;base64,'.length) * 3 / 4);
            if (approx >= file.size) return origRead.call(self, file); // 圧縮で大きくなるなら原本のまま

            Object.defineProperty(self, 'result',     { configurable: true, get: function(){ return dataUrl; } });
            Object.defineProperty(self, 'readyState', { configurable: true, get: function(){ return 2; } }); // DONE
            self.dispatchEvent(new ProgressEvent('loadstart'));
            self.dispatchEvent(new ProgressEvent('load'));
            self.dispatchEvent(new ProgressEvent('loadend'));
          } catch (e) {
            try { URL.revokeObjectURL(url); } catch (_) {}
            origRead.call(self, file);
          }
        };
        img.onerror = function () {
          try { URL.revokeObjectURL(url); } catch (_) {}
          origRead.call(self, file);
        };
        img.src = url;
      } catch (e) {
        return origRead.call(self, file);
      }
    };
  })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
