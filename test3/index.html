<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniTrus TikTokライバー プロフィール一覧(50名)</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--txt:#e8eaf0;--sub:#9aa1b5;--acc:#fe2c55;--acc2:#25f4ee;--line:#2a2e3d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;padding:24px}
header{max-width:1240px;margin:0 auto 20px}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
h1 span{color:var(--acc)}
.meta{color:var(--sub);font-size:12.5px;margin-bottom:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:220px;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:14px}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--txt);font-size:13.5px}
.count{color:var(--sub);font-size:13px;margin-left:auto}
.grid{max-width:1240px;margin:18px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.top{display:flex;gap:12px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--line)}
.names{min-width:0}
.nick{font-size:15px;font-weight:700;line-height:1.3;word-break:break-all}
.uid{font-size:12px;color:var(--acc2);text-decoration:none;word-break:break-all}
.uid:hover{text-decoration:underline}
.stats{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:15px}
.stat span{font-size:10.5px;color:var(--sub)}
.bio{font-size:12px;color:var(--sub);line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:7.8em;overflow:auto}
.sns{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#242838;color:var(--acc2);border:1px solid #2e3448;text-decoration:none}
a.tag:hover{border-color:var(--acc2)}
.tag.plain{color:var(--sub)}
.btn{margin-top:auto;text-align:center;background:var(--acc);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;padding:8px;border-radius:8px}
.btn:hover{opacity:.85}
footer{max-width:1240px;margin:26px auto 0;color:var(--sub);font-size:11.5px;line-height:1.6}
</style>
</head>

<header>
<h1><span>UniTrus</span> TikTokライバー プロフィール一覧 <small style="font-weight:400;color:var(--sub)">50名</small></h1>

DATA.forEach((c,i)=>c._i=i);
const grid = document.getElementById('grid');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(list){
  grid.innerHTML = list.map(c=>`
  <div class="card">
    <div class="top">
      <img class="avatar" src="${c.img}" alt="${esc(c.nick)}" loading="lazy">
      <div class="names">
        <div class="nick">${esc(c.nick)}</div>
        <a class="uid" href="${c.url}" target="_blank" rel="noopener">@${esc(c.id)}</a>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${c.folF}</b><span>フォロワー</span></div>
      <div class="stat"><b>${c.ingF}</b><span>フォロー中</span></div>
      <div class="stat"><b>${c.likesF}</b><span>いいね</span></div>
    </div>
    ${c.bio?`<div class="bio">${esc(c.bio)}</div>`:''}
    ${c.sns.length?`<div class="sns">${c.sns.map(s=>s.url?`<a class="tag" href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`:`<span class="tag plain">${esc(s.label)}</span>`).join('')}</div>`:''}
    <a class="btn" href="${c.url}" target="_blank" rel="noopener">TikTokプロフィールを開く</a>
  </div>`).join('');
  document.getElementById('count').textContent = list.length + ' / ' + DATA.length + '名';
}
function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const s = document.getElementById('sort').value;
  let list = DATA.filter(c=>!q || c.nick.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)||(c.bio||'').toLowerCase().includes(q));
  const nv = v=>v==null?-1:v;
  if(s==='fol_desc') list.sort((a,b)=>nv(b.fol)-nv(a.fol));
  else if(s==='fol_asc') list.sort((a,b)=>nv(a.fol)-nv(b.fol));
  else if(s==='likes_desc') list.sort((a,b)=>nv(b.likes)-nv(a.likes));
  else list.sort((a,b)=>a._i-b._i);
  render(list);
}
document.getElementById('q').addEventListener('input',apply);
document.getElementById('sort').addEventListener('change',apply);
apply();
